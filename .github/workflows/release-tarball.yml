name: Build and Upload Release Tarball

on:
  release:
    types: [created]

jobs:
  build-tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      
      - name: Get tag name
        run: |
          echo "TAG_NAME=${{ github.event.release.tag_name }}" >> $GITHUB_ENV

      - name: Create tarball
        run: |
          TARBALL="rqc-ojs-$TAG_NAME.tar.gz"
          TARBALL_PATH="$RUNNER_TEMP/${TARBALL}"
          echo "${TARBALL_PATH}"
          tar -czf "${TARBALL_PATH}" \
            --exclude='tests' \
            --exclude='z' \
            --exclude='.git' \
            --exclude='.idea' \
            --exclude='.github' \
            -C /home/runner/work/ojs-rqcplugin \
            ojs-rqcplugin \
            --transform 's|^ojs-rqcplugin|rqc|'
            
          echo "TARBALL=${TARBALL}" >> $GITHUB_ENV
          echo "TARBALL_PATH=${TARBALL_PATH}" >> $GITHUB_ENV
      
      - name: Calculate MD5 hash
        run: |
          MD5=$(md5sum $TARBALL_PATH | awk '{print $1}')
          echo "MD5 Hash: ${MD5}"
          echo "MD5=${MD5}" >> $GITHUB_ENV
      
      - name: Upload tarball to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $TAG_NAME $TARBALL_PATH --clobber

      - name: Update release notes with MD5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BODY="$(gh release view "$TAG_NAME" --json body --jq .body)"
          gh release edit $TAG_NAME --notes "$(
            printf '%s\n\n%s\n\n%s\n' \
            "${CURRENT_BODY}" \
            "## Download Verification" \
            "MD5 Hash for $TARBALL: $MD5"
          )"
    
